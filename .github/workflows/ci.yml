name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      duetwebcontrol_ref:
        description: 'Meltingplot/DuetWebControl branch/tag to build against (default: v3.7-dev)'
        required: false
        default: ''

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # dsf-python 3.7 needs >= 3.11; the CHX 350 image (Debian trixie) runs 3.13
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The real dsf-python the image pins, not a mock: the tests deserialize object-model
      # JSON through it and check the patches in dsf/qa_patches.py
      - name: Install dependencies
        run: pip install "pytest>=8" "pytest-cov>=5" "dsf-python==3.7.0b1"

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov --cov-report=term-missing
        env:
          PYTHONPATH: dsf

  frontend-tests:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  build:
    name: Build Plugin ZIP (DWC 3.7)
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0
          fetch-tags: true

      # The Meltingplot fork is what the CHX 350 runs (3.7.0-rc.2+mp.N)
      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Meltingplot/DuetWebControl
          ref: ${{ github.event.inputs.duetwebcontrol_ref || 'v3.7-dev' }}
          path: DuetWebControl

      # Vite 8 needs Node >= 22.12
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install DWC dependencies
        working-directory: DuetWebControl
        run: npm install

      # A complete install makes the builder's installPluginDependencies() a no-op, so
      # nothing is resolved on the fly next to a Vite build
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Compute version from git
        id: version
        working-directory: plugin
        run: |
          version=$(node scripts/version.js --write | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The builder copies dsf/ verbatim (minus tests/ and __pycache__)
      - name: Build plugin
        working-directory: DuetWebControl
        run: node scripts/build-plugin-pkg.js ../plugin

      - name: Verify the package
        run: bash plugin/scripts/verify-package.sh "plugin/QualityAssurance-${{ steps.version.outputs.version }}.zip" DuetWebControl

      # GitHub wraps every artifact in a ZIP of its own, so upload the unpacked tree; the
      # download is then directly installable. The builder also writes
      # QualityAssurance-<ver>-srcmap.zip, which is why the package is addressed by name
      - name: Unpack plugin ZIP for artifact upload
        run: |
          mkdir -p artifact
          unzip "plugin/QualityAssurance-${{ steps.version.outputs.version }}.zip" -d artifact

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: QualityAssurance-dwc37
          path: artifact/*
          retention-days: 30
